services:
  python-tests:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    read_only: true
    tmpfs:
      - /tmp
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    command: ["python", "-m", "pytest", "-q"]
    profiles: ["test"]

  rust-tests:
    build:
      context: ./rust-tokenizer
      dockerfile: Dockerfile
    init: true
    read_only: true
    tmpfs:
      - /tmp
    command: ["cargo", "test", "--all-targets"]
    profiles: ["test"]
