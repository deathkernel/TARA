name: TARA conversation CI

concurrency:
  group: tara-chat-ci-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  conversation-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Static repository audit
        run: python -m src.repository_audit .
      - name: Conversation-focused test suite
        run: python -m pytest -q
