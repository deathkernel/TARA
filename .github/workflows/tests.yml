name: TARA CI

on:
  # Pull requests are the primary validation path. Avoid running the same
  # feature-branch commit twice (push + pull_request).
  pull_request:
  workflow_dispatch:

# Keep only the newest validation run for each PR; new commits supersede old
# queued/running validation jobs. Manual dispatches are isolated by ref.
concurrency:
  group: tara-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      # Trial only: benchmark bounded parallel pytest workers on an isolated PR.
      - name: Install pytest-xdist for CI performance trial
        run: python -m pip install pytest-xdist
      - name: Static repository audit
        run: python -m src.repository_audit .
      - name: Focused regression tests
        run: >-
          python -m pytest -q
          tests/test_unified_cognitive_loop.py
          tests/test_tara_core.py
          tests/test_continual_learning_cycle.py
          tests/test_dataset_acquisition.py
          tests/test_evaluation_orchestrator.py
          tests/test_intelligence_improvement.py
          tests/test_language_model.py
          tests/test_learning_experiment.py
          tests/test_model_adapter.py
          tests/test_model_capability_runner.py
          tests/test_multimodal_perception.py
          tests/test_phase19_scheduler.py
          tests/test_self_improvement.py
          tests/test_self_developer.py
          tests/test_transformer.py
      - name: Full Python test suite (bounded parallel trial)
        run: python -m pytest -q -n 2 --dist=loadfile --durations=20
      - name: XOR smoke experiment
        run: python train_xor.py
      - name: Tiny language-model smoke experiment
        run: python train_tiny_lm.py

  rust-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust-tokenizer
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-targets
