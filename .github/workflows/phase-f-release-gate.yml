name: TARA Phase F release integration gate

on:
  workflow_dispatch:
  pull_request:
    branches:
      - feature/tara-phase-e-teacher-pipeline-integration
      - feature/tara-phase-f-release-integration

permissions:
  contents: read

jobs:
  python-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run complete Python regression suite
        run: python -m pytest -q
      - name: Verify teacher pipeline command surface without generating data
        run: python -m src.teacher_pipeline --help

  rust-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run Rust tokenizer tests
        run: cargo test --manifest-path rust-tokenizer/Cargo.toml
