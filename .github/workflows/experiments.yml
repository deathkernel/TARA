name: TARA experiments

# Avoid stacking costly experiment jobs while newer code is already queued.
concurrency:
  group: tara-experiments-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    paths:
      - "experiments/compare_trained_profiles.py"
      - "experiments/run_profile_seeds.py"
      - "experiments/scaled_lm_diagnostics.py"
      - "src/attention.py"
      - "src/autograd.py"
      - "src/embeddings.py"
      - "src/gradient_clipping.py"
      - "src/initialization.py"
      - "src/language_dataset.py"
      - "src/language_model.py"
      - "src/layers.py"
      - "src/numeric_inference.py"
      - "src/optimizers.py"
      - "src/positional.py"
      - "src/schedulers.py"
      - "src/tokenizer.py"
      - "src/transformer.py"
      - "requirements.txt"

jobs:
  trained-profile-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Run three-seed Tiny vs Scaled experiment
        run: python -m experiments.run_profile_seeds > profile_results.json
      - name: Publish experiment output
        uses: actions/upload-artifact@v4
        with:
          name: trained-profile-results
          path: profile_results.json
