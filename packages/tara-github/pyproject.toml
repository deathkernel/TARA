[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tara-github"
version = "0.1.0"
description = "A small, safe GitHub API client and TARA tool adapter"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "TARA contributors" }]
dependencies = []

[project.scripts]
tara-github = "tara_github.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
